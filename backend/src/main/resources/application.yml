spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: retail-management-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/retail}
    username: ${DATABASE_USERNAME:retail}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
server:
  port: ${PORT:8080}
  address: 0.0.0.0
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc.core: INFO
